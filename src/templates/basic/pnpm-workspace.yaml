# pnpm reads its project settings from here (a single-package workspace).

# The editor chain hands Y.Docs between libraries, so the Worker bundle must
# hold exactly one copy of yjs. @ixo/editor 6.0.1 pins yjs 13.6.27 exactly
# while everything else, the runtime included, resolves 13.6.32; two copies
# break yjs's instanceof checks ("Yjs was already imported"). pnpm does not
# inherit overrides from a dependency, so every app on the runtime carries
# this one until @ixo/editor widens its pin.
overrides:
  yjs: '13.6.32'
  # LangSmith before 0.6.0 can trust public prompt pulls implicitly
  # (CVE-2026-45134); keep LangChain's own copy on the patched line too.
  'langsmith@<0.6.0': '^0.6.0'

# The runtime's dependency chain (@ixo/common → @ixo/oracles-chain-client →
# @veramo/credential-ld) reaches @veramo-community/lds-ecdsa-secp256k1-recovery2020,
# which Veramo publishes only as a git dependency; pnpm blocks such exotic
# transitive dependencies by default.
blockExoticSubdeps: false

# Optional React peers of the editor packages; the Worker never renders them.
peerDependencyRules:
  ignoreMissing:
    - 'react'
    - 'react-dom'
    - 'react-jazzicon'
    - '@mantine/core'
    - '@mantine/hooks'
    - '@blocknote/core'
    - '@blocknote/react'
    - '@blocknote/mantine'
    - '@ixo/surveys'

# Install scripts. Only wrangler's bundler (esbuild) and the local Workers
# runtime (workerd) need theirs. The rest are native Node addons the runtime's
# dependencies carry for Node; a Worker bundle never loads them.
# pnpm 11 reads `allowBuilds` and fails the install on any package left out;
# pnpm 10 reads `onlyBuiltDependencies` / `ignoredBuiltDependencies`.
allowBuilds:
  esbuild: true
  workerd: true
  '@ixo/matrix-sdk-crypto-nodejs': false
  better-sqlite3: false
  maplibre-gl: false
  protobufjs: false
  secp256k1: false
onlyBuiltDependencies:
  - esbuild
  - workerd
ignoredBuiltDependencies:
  - '@ixo/matrix-sdk-crypto-nodejs'
  - better-sqlite3
  - maplibre-gl
  - protobufjs
  - secp256k1

# pnpm 11 holds back versions younger than a day; IXO's own packages are
# released together and must install as soon as they are published.
minimumReleaseAgeExclude:
  - '@ixo/*'
